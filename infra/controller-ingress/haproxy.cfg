global
    log stdout format raw local0
    maxconn 2048
    ssl-default-bind-options ssl-min-ver TLSv1.3


defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 35s
    timeout server 35s
    timeout http-request 10s
    timeout http-keep-alive 10s

frontend deploytide_controller_mtls
    bind :8443 ssl crt "${DEPLOYTIDE_CONTROLLER_TLS_PEM}" ca-file "${DEPLOYTIDE_CONTROLLER_CLIENT_CA}" verify required alpn h2,http/1.1 ssl-min-ver TLSv1.3

    http-request del-header X-DeployTide-Controller-Proxy
    http-request del-header X-DeployTide-Client-Serial
    http-request del-header X-DeployTide-Client-Subject
    http-request del-header X-DeployTide-Client-Fingerprint
    http-request del-header X-Forwarded-Client-Cert
    http-request del-header X-SSL-Client-Cert
    http-request del-header X-SSL-Client-DN
    http-request del-header X-SSL-Client-Serial
    http-request del-header X-SSL-Client-Verify

    acl method_get method GET
    acl method_post method POST
    acl route_jobs path_reg ^/api/operator/controllers/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,191}/jobs$
    acl route_heartbeat path_reg ^/api/operator/controllers/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,191}/heartbeat$
    acl route_ack path_reg ^/api/operator/controllers/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,191}/jobs/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,191}/ack$
    acl route_result path_reg ^/api/operator/controllers/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,191}/jobs/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,191}/result$
    http-request deny deny_status 404 unless method_get route_jobs or method_post route_heartbeat or method_post route_ack or method_post route_result

    http-request set-header X-DeployTide-Client-Serial %[ssl_c_serial,hex]
    http-request set-header X-DeployTide-Client-Subject %[ssl_c_s_dn]
    http-request set-header X-DeployTide-Client-Fingerprint %[ssl_c_der,sha2(256),hex]
    http-request set-header X-DeployTide-Controller-Proxy "${DEPLOYTIDE_CONTROLLER_PROXY_SECRET}"
    default_backend deploytide_controller_api

backend deploytide_controller_api
    server app "${DEPLOYTIDE_APP_BACKEND}" check
